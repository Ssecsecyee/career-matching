<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>전문가 피드백 요청</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--line:#D5DBDB;--sub:#545B64;--soft:#F2F3F3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000;word-break:keep-all}
.slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
.top{padding:56px 40px 0}
.top h1{font-size:56px;font-weight:700;letter-spacing:1px}
.top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
.top p{margin-top:18px;font-size:30px;color:var(--sub)}
.card{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .hd{background:var(--ink);color:#fff;font-size:28px;font-weight:900;padding:16px 24px;display:flex;align-items:center;gap:14px}
.card .hd .n{background:var(--orange);color:var(--ink2);border-radius:16px;padding:0 12px;font-size:22px}
.bar{position:absolute;left:40px;right:40px;bottom:50px;min-height:84px;border:3px solid var(--orange);border-radius:14px;display:flex;align-items:center;gap:24px;padding:0 26px;background:#FFF8EC}
.bar .tag{background:var(--ink);color:#fff;border-radius:30px;padding:6px 22px;font-size:24px;font-weight:900;flex:none}
.bar .txt{font-size:28px;font-weight:700;color:var(--ink2)}
.bar .txt b{color:var(--orange2)}
.row{display:flex;gap:40px;padding:44px 40px 0;align-items:stretch}
.left{width:640px;height:600px}.left .hd{font-size:24px}
ul{list-style:none;padding:40px 34px;display:flex;flex-direction:column;gap:28px}
li{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700;color:var(--ink2);padding:20px 22px;background:var(--soft);border-radius:14px}
li i{font-style:normal;flex:none;width:44px;height:44px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.photo{flex:1;height:600px;border:3px solid var(--ink);border-radius:18px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body><div class="slide">
<div class="top"><h1>전문가 피드백 요청<span class="dot"></span></h1><p>휴먼인교육컨설팅(주) 전진근 대표</p></div>

<div class="row">
 <div class="card left"><div class="hd"><span class="n">점검</span>취업 상담 관점에서 서비스 흐름 점검</div>
  <ul><li><i>1</i>질문 방식의 적절성</li><li><i>2</i>보완 방향 안내의 실효성</li><li><i>3</i>취업 준비생에게 필요한 추가 기능</li></ul></div>
 <div class="photo"><img src="photo-expert.jpg"></div>
</div>
</div></body></html>
