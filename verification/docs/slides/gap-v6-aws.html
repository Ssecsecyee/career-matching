<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>역량 Gap 분석</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--line:#D5DBDB;--sub:#545B64;--soft:#F2F3F3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000;word-break:keep-all}
  .slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
  .top{padding:56px 40px 0}
  .top h1{font-size:56px;font-weight:700;letter-spacing:1px}
  .top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
  .top p{margin-top:18px;font-size:30px;color:var(--sub)}
  .top p b{color:var(--orange2)}
  .row{display:flex;align-items:stretch;gap:18px;padding:40px 40px 0}
  .card{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column;height:560px}
  .card .hd{background:var(--ink);color:#fff;font-size:26px;font-weight:900;padding:14px 0;text-align:center}
  .card .hd .n{display:inline-block;background:var(--orange);color:var(--ink2);border-radius:16px;padding:0 12px;margin-right:10px;font-size:22px}
  .card .hd em{font-style:normal;color:var(--orange)}
  .card.warn{border-color:var(--orange)}
  .card.warn .hd{background:var(--orange);color:var(--ink2)}
  .card.warn .hd .n{background:var(--ink);color:#fff}
  .c1{width:340px}.c2{width:340px}.c3{flex:1}
  .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
  .cap{font-size:20px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.4}
  .pill{width:100%;display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:700;color:var(--ink2);background:#fff}
  .pill .ic{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px}
  .arrow{align-self:center}
  .flow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
  .v6{width:430px;border:3px solid var(--orange);border-radius:16px;background:#FFF8EC;padding:12px 16px}
  .v6 .t{justify-content:center;font-size:24px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:8px}
  .v6 .chips{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .v6 .chips span{white-space:nowrap;background:#fff;border:2px solid var(--ink);border-radius:22px;padding:6px 16px;font-size:20px;font-weight:900;color:var(--ink2)}
  .v6 .chips span.o{background:var(--orange);border-color:var(--orange)}
  .v6 .chips i{font-style:normal;color:var(--orange2);font-weight:900;font-size:22px}
  .v6 .t span{background:var(--ink);color:#fff;border-radius:8px;font-size:15px;padding:1px 8px}
  .v6 .m{display:flex;gap:10px;margin-top:10px}
  .v6 .m div{flex:1;background:#fff;border-radius:10px;border:2px solid var(--line);padding:6px 4px;text-align:center}
  .v6 .m b{display:block;font-size:30px;font-weight:900;color:var(--ink2);line-height:1.2}
  .v6 .m b.o{color:var(--orange2)}
  .v6 .m small{font-size:14px;color:var(--sub);font-weight:700}
  .v6 .why{text-align:center;margin-top:14px !important;white-space:nowrap;margin-top:10px;font-size:15px;font-weight:700;color:var(--ink2);line-height:1.5}
  .v6 .why em{font-style:normal;color:var(--orange2)}
  .steps{display:flex;width:100%;border:2px solid var(--line);border-radius:14px;background:var(--soft)}
  .steps div{flex:1;display:flex;align-items:center;gap:10px;padding:12px 12px;font-size:18px;font-weight:700;color:var(--ink2);line-height:1.35}
  .steps div + div{border-left:2px solid var(--line)}
  .steps .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--orange);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
  .engine{text-align:center;width:300px}
  .engine .name{margin-top:12px;font-size:32px;font-weight:900;color:var(--ink2)}
  .engine .does{margin-top:4px;font-size:20px;font-weight:700;color:var(--orange2)}
  text{font-family:"Noto Sans KR",sans-serif;font-weight:700}
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <h1>데이터 연계와 역량 Gap 분석<span class="dot"></span></h1>
    <p>채용공고–교육공고 간 <b>역량 Gap</b>을 분석해, 필요한 교육을 연결합니다</p>
  </div>

  <div class="row">
    <!-- 1 -->
    <div class="card c1">
      <div class="hd"><span class="n">1</span>본래 계획</div>
      <div class="body">
        <svg width="300" height="190" viewBox="0 0 300 190">
          <rect x="10" y="10" width="110" height="130" rx="12" fill="#fff" stroke="#232F3E" stroke-width="5"/>
          <rect x="26" y="26" width="78" height="34" rx="6" fill="#232F3E"/><text x="65" y="51" text-anchor="middle" font-size="20" fill="#FF9900">JOB</text>
          <rect x="26" y="76" width="78" height="8" rx="4" fill="#D5DBDB"/><rect x="26" y="94" width="64" height="8" rx="4" fill="#D5DBDB"/><rect x="26" y="112" width="70" height="8" rx="4" fill="#D5DBDB"/>
          <circle cx="150" cy="75" r="20" fill="#FF9900"/><path d="M150 64v22M139 75h22" stroke="#232F3E" stroke-width="6" stroke-linecap="round"/>
          <rect x="180" y="10" width="110" height="130" rx="12" fill="#fff" stroke="#146EB4" stroke-width="5"/>
          <path d="M205 40 l30 -12 30 12 -30 12z" fill="#146EB4"/><path d="M217 46v14c10 6 26 6 36 0v-14" fill="#146EB4"/>
          <rect x="196" y="82" width="78" height="8" rx="4" fill="#D5DBDB"/><rect x="196" y="100" width="64" height="8" rx="4" fill="#D5DBDB"/><rect x="196" y="118" width="70" height="8" rx="4" fill="#D5DBDB"/>
          <text x="65" y="172" text-anchor="middle" font-size="18" fill="#131A22">채용공고</text>
          <text x="235" y="172" text-anchor="middle" font-size="18" fill="#146EB4">교육공고</text>
        </svg>
        <div class="cap">둘 다 고용24 API로<br>동시 수집</div>
      </div>
    </div>

    <svg class="arrow" width="40" height="40" viewBox="0 0 40 40"><path d="M0 13h22V0l18 20-18 20V27H0z" fill="#FF9900"/></svg>

    <!-- 2 -->
    <div class="card c2 warn">
      <div class="hd"><span class="n">2</span>현실적 제약</div>
      <div class="body">
        <svg width="260" height="170" viewBox="0 0 260 170">
          <rect x="30" y="14" width="180" height="118" rx="12" fill="#232F3E"/>
          <rect x="44" y="28" width="152" height="90" rx="6" fill="#fff"/>
          <text x="120" y="66" text-anchor="middle" font-size="24" fill="#131A22">고용24</text>
          <text x="120" y="98" text-anchor="middle" font-size="24" fill="#131A22">API</text>
          <path d="M14 136 h212 l-12 16 h-188z" fill="#37475A"/>
          <path d="M212 76 l36 62 h-72z" fill="#FF9900"/><rect x="208" y="96" width="8" height="22" rx="4" fill="#232F3E"/><circle cx="212" cy="127" r="5" fill="#232F3E"/>
        </svg>
        <div class="pill"><span class="ic" style="background:#879596">✕</span>채용공고 수집 불가<br>(API 권한 제한)</div>
        <div class="pill"><span class="ic" style="background:#146EB4">✓</span>교육공고만 수집 가능</div>
      </div>
    </div>

    <svg class="arrow" width="40" height="40" viewBox="0 0 40 40"><path d="M0 13h22V0l18 20-18 20V27H0z" fill="#FF9900"/></svg>

    <!-- 3 -->
    <div class="card c3">
      <div class="hd"><span class="n">3</span>해결 방향 : <em>검증 기반 역량 매칭</em></div>
      <div class="body" style="gap:16px">
        <div class="flow">
          <svg width="110" height="130" viewBox="0 0 110 130">
            <rect x="5" y="5" width="100" height="120" rx="12" fill="#fff" stroke="#232F3E" stroke-width="5"/>
            <rect x="18" y="18" width="74" height="32" rx="6" fill="#232F3E"/><text x="55" y="42" text-anchor="middle" font-size="19" fill="#FF9900">JOB</text>
            <rect x="18" y="66" width="74" height="8" rx="4" fill="#D5DBDB"/><rect x="18" y="84" width="60" height="8" rx="4" fill="#D5DBDB"/><rect x="18" y="102" width="66" height="8" rx="4" fill="#D5DBDB"/>
          </svg>
          <svg width="30" height="30" viewBox="0 0 40 40"><path d="M0 13h22V0l18 20-18 20V27H0z" fill="#FF9900"/></svg>
          <div class="engine">
            <svg width="150" height="150" viewBox="0 0 150 150">
              <rect width="150" height="150" rx="24" fill="#232F3E"/>
              <path d="M66 36c-14 0-22 10-22 20-8 3-12 10-12 18s4 15 12 18c0 10 8 20 22 20z" fill="none" stroke="#FF9900" stroke-width="7" stroke-linejoin="round"/>
              <path d="M66 36v76" stroke="#FF9900" stroke-width="7"/>
              <path d="M66 52h22l10-10M66 74h40M66 96h22l10 10" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="104" cy="38" r="7" fill="#fff"/><circle cx="114" cy="74" r="7" fill="#fff"/><circle cx="104" cy="110" r="7" fill="#fff"/>
            </svg>
            <div class="name">Bedrock</div>
            <div class="does">역량 추출 · 교육 매칭</div>
          </div>
          <svg width="30" height="30" viewBox="0 0 40 40"><path d="M0 13h22V0l18 20-18 20V27H0z" fill="#FF9900"/></svg>
          <svg width="110" height="130" viewBox="0 0 110 130">
            <rect x="5" y="5" width="100" height="120" rx="12" fill="#fff" stroke="#146EB4" stroke-width="5"/>
            <path d="M25 38 l30 -12 30 12 -30 12z" fill="#146EB4"/><path d="M37 44v14c10 6 26 6 36 0v-14" fill="#146EB4"/>
            <rect x="18" y="78" width="74" height="8" rx="4" fill="#D5DBDB"/><rect x="18" y="96" width="60" height="8" rx="4" fill="#D5DBDB"/>
          </svg>
        </div>
        <div class="steps">
          <div><span class="k">1</span>공고에서 역량 추출<br>(기술·스킬)</div>
          <div><span class="k">2</span>사람 판정으로<br>추천 결과 검증</div>
          <div><span class="k">3</span>Gap 분석 및<br>맞춤 교육 추천</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
