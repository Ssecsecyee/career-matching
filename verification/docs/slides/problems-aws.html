<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>발견한 문제점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--teal:#00A1C9;--line:#D5DBDB;--sub:#545B64}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000}
  .slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
  .top{padding:56px 40px 0}
  .top h1{font-size:56px;font-weight:700;letter-spacing:1px}
  .top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
  .top p{margin-top:18px;font-size:30px;color:var(--sub)}
  .body{display:flex;align-items:center;padding:30px 40px 0 60px;gap:90px}
  .art{width:600px;height:544px;flex:none}
  .probs{flex:1}
  .prob + .prob{margin-top:70px}
  .tag{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:30px;padding:6px 20px 6px 8px;font-size:24px;font-weight:700}
  .tag .n{background:var(--orange);color:var(--ink2);border-radius:20px;padding:2px 12px;font-size:20px;font-weight:900}
  .head{margin-top:20px;font-size:40px;font-weight:700;color:#000}
  .sol{margin-top:22px;display:flex;align-items:center;gap:22px;font-size:36px;font-weight:700;color:var(--orange2)}
  .sol svg{flex:none}
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <h1>발견한 문제점<span class="dot"></span></h1>
    <p>AI가 활용하는 검색의 최적화</p>
  </div>
  <div class="body">
    <svg class="art" viewBox="0 0 640 580">
      <!-- 겹친 공고 문서 -->
      <g transform="translate(290 6) scale(0.58)">
      <g transform="rotate(-6 150 150)">
        <rect x="40" y="40" width="190" height="240" rx="14" fill="#fff" stroke="#232F3E" stroke-width="8"/>
        <rect x="70" y="72" width="54" height="40" rx="6" fill="#232F3E"/><rect x="86" y="64" width="22" height="12" rx="3" fill="none" stroke="#232F3E" stroke-width="5"/>
        <rect x="70" y="135" width="130" height="12" rx="6" fill="#D5DBDB"/><rect x="70" y="160" width="110" height="12" rx="6" fill="#D5DBDB"/><rect x="70" y="185" width="120" height="12" rx="6" fill="#D5DBDB"/>
      </g>
      <g transform="rotate(4 200 170)">
        <rect x="100" y="70" width="190" height="240" rx="14" fill="#fff" stroke="#146EB4" stroke-width="8"/>
        <rect x="130" y="102" width="54" height="40" rx="6" fill="#146EB4"/><rect x="146" y="94" width="22" height="12" rx="3" fill="none" stroke="#146EB4" stroke-width="5"/>
        <rect x="130" y="165" width="130" height="12" rx="6" fill="#D5DBDB"/><rect x="130" y="190" width="110" height="12" rx="6" fill="#D5DBDB"/><rect x="130" y="215" width="120" height="12" rx="6" fill="#D5DBDB"/>
      </g>
      <!-- 중복 배지 -->
      <circle cx="285" cy="80" r="42" fill="#FF9900"/>
      <rect x="262" y="66" width="30" height="30" rx="5" fill="none" stroke="#232F3E" stroke-width="6"/>
      <rect x="276" y="54" width="30" height="30" rx="5" fill="#FF9900" stroke="#232F3E" stroke-width="6"/>
      <!-- 마감 공고 -->
      <g transform="rotate(5 470 160)">
        <rect x="380" y="50" width="190" height="240" rx="14" fill="#F2F3F3" stroke="#879596" stroke-width="8"/>
        <rect x="410" y="82" width="54" height="40" rx="6" fill="#879596"/><rect x="426" y="74" width="22" height="12" rx="3" fill="none" stroke="#879596" stroke-width="5"/>
        <rect x="410" y="145" width="130" height="12" rx="6" fill="#D5DBDB"/><rect x="410" y="170" width="100" height="12" rx="6" fill="#D5DBDB"/>
      </g>
      <circle cx="530" cy="245" r="52" fill="#fff" stroke="#EC7211" stroke-width="10"/>
      <rect x="505" y="225" width="50" height="42" rx="6" fill="none" stroke="#232F3E" stroke-width="6"/>
      <line x1="505" y1="238" x2="555" y2="238" stroke="#232F3E" stroke-width="6"/>
      <line x1="518" y1="216" x2="518" y2="230" stroke="#232F3E" stroke-width="6" stroke-linecap="round"/>
      <line x1="542" y1="216" x2="542" y2="230" stroke="#232F3E" stroke-width="6" stroke-linecap="round"/>
      <line x1="494" y1="281" x2="566" y2="209" stroke="#EC7211" stroke-width="10" stroke-linecap="round"/>
      </g>
      <!-- 메인 캐릭터(원본) -->
      <image href="char_main.png" x="0" y="96" width="318" height="438"/>
      <!-- 돋보기: 깃 vs Git -->
      <g transform="translate(170 22)">
      <rect x="370" y="462" width="34" height="100" rx="16" transform="rotate(-45 387 512)" fill="#FF9900"/>
      <circle cx="300" cy="400" r="105" fill="#fff" stroke="#232F3E" stroke-width="16"/>
      <circle cx="300" cy="400" r="90" fill="#E8F4FB"/>
      <rect x="218" y="378" width="72" height="44" rx="22" fill="#fff" stroke="#232F3E" stroke-width="4"/>
      <text x="254" y="409" text-anchor="middle" font-family="Noto Sans KR" font-weight="700" font-size="24" fill="#232F3E">깃</text>
      <rect x="312" y="378" width="82" height="44" rx="22" fill="#146EB4"/>
      <text x="353" y="409" text-anchor="middle" font-family="Noto Sans KR" font-weight="700" font-size="24" fill="#fff">Git</text>
      <text x="301" y="372" text-anchor="middle" font-family="Noto Sans KR" font-weight="900" font-size="34" fill="#EC7211">?</text>
      <text x="301" y="452" text-anchor="middle" font-family="Noto Sans KR" font-weight="700" font-size="24" fill="#879596">≠</text>
      </g>
    </svg>

    <div class="probs">
      <div class="prob">
        <span class="tag"><span class="n">문제 1</span>중복·마감 공고</span>
        <div class="head">같은 공고 반복 / 지난 공고 노출</div>
        <div class="sol"><svg width="80" height="24" viewBox="0 0 80 24"><path d="M0 9h60V0l20 12-20 12v-9H0z" fill="#FF9900"/></svg>ID로 중복 방지 · 마감 정책으로 제외</div>
      </div>
      <div class="prob">
        <span class="tag"><span class="n">문제 2</span>깃 ≠ Git</span>
        <div class="head">같은 기술인데 표현이 달라 누락</div>
        <div class="sol"><svg width="80" height="24" viewBox="0 0 80 24"><path d="M0 9h60V0l20 12-20 12v-9H0z" fill="#FF9900"/></svg>검색 분석기의 동의어 사전으로 연결</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
