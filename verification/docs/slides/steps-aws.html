<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>취업 준비 3단계</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--sub:#545B64}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000;word-break:keep-all}
  .slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
  .top{padding:56px 40px 0}
  .top h1{font-size:56px;font-weight:700;letter-spacing:1px}
  .top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
  .cards{display:flex;gap:40px;padding:70px 60px 0}
  .card{flex:1;height:600px;border:3px solid var(--ink);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
  .card .hd{background:var(--ink);height:130px;display:flex;align-items:center;justify-content:center;gap:16px}
  .card .n{background:var(--orange);color:var(--ink2);font-size:22px;font-weight:900;border-radius:20px;padding:2px 14px}
  .card .q{color:#fff;font-size:36px;font-weight:900}
  .card .art{height:270px;display:flex;align-items:center;justify-content:center;padding-top:16px}
  .card .art svg{height:250px;width:auto}
  .card ul{list-style:none;padding:18px 40px 0}
  .card li{font-size:27px;font-weight:700;color:#131A22;line-height:1.9;display:flex;align-items:center;gap:14px;white-space:nowrap}
  .card li:before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;background:#146EB4;color:#fff;font-size:20px;font-weight:900;flex:none}
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <h1>취업 준비 과정의 3단계 흐름<span class="dot"></span></h1>
  </div>
  <div class="cards">
    <div class="card">
      <div class="hd"><span class="n">01</span><span class="q">목표 설정</span></div>
      <div class="art">
        <svg width="380" height="320" viewBox="0 0 380 320">
          <rect x="40" y="40" width="250" height="170" rx="14" fill="#232F3E"/>
          <rect x="54" y="54" width="222" height="142" rx="6" fill="#fff"/>
          <circle cx="70" cy="68" r="5" fill="#FF9900"/><circle cx="86" cy="68" r="5" fill="#879596"/><circle cx="102" cy="68" r="5" fill="#879596"/>
          <rect x="66" y="88" width="196" height="40" rx="6" fill="#E8F4FB"/>
          <rect x="76" y="98" width="26" height="20" rx="4" fill="#146EB4"/><rect x="112" y="100" width="110" height="8" rx="4" fill="#146EB4"/><rect x="112" y="114" width="80" height="6" rx="3" fill="#B8C0C0"/>
          <rect x="66" y="138" width="196" height="40" rx="6" fill="#E8F4FB"/>
          <rect x="76" y="148" width="26" height="20" rx="4" fill="#146EB4"/><rect x="112" y="150" width="110" height="8" rx="4" fill="#146EB4"/><rect x="112" y="164" width="80" height="6" rx="3" fill="#B8C0C0"/>
          <path d="M20 214 h290 l-18 22 h-254z" fill="#37475A"/>
          <rect x="300" y="230" width="28" height="84" rx="13" transform="rotate(-45 314 272)" fill="#232F3E"/>
          <circle cx="270" cy="190" r="58" fill="#fff" stroke="#FF9900" stroke-width="16"/>
          <rect x="248" y="178" width="44" height="32" rx="5" fill="#232F3E"/><rect x="261" y="170" width="18" height="10" rx="3" fill="none" stroke="#232F3E" stroke-width="4"/>
          <path d="M330 120 l14 -14 M342 146 l20 -4 M316 104 l2 -20" stroke="#FF9900" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
      <ul><li>관심 있는 공고 탐색</li><li>목표로 삼은 공고 선택</li></ul>
    </div>
    <div class="card">
      <div class="hd"><span class="n">02</span><span class="q">공고 적합성 확인</span></div>
      <div class="art">
        <svg width="380" height="330" viewBox="0 0 380 330">
          <rect x="60" y="30" width="210" height="270" rx="18" fill="#232F3E"/>
          <rect x="76" y="56" width="178" height="228" rx="8" fill="#fff"/>
          <rect x="125" y="16" width="80" height="34" rx="10" fill="#37475A"/>
          <circle cx="165" cy="22" r="8" fill="#fff"/>
          <g>
            <rect x="94" y="80" width="30" height="30" rx="6" fill="#146EB4"/><path d="M101 95l6 6 11-12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="134" y="84" width="96" height="9" rx="4" fill="#232F3E"/><rect x="134" y="99" width="66" height="7" rx="3" fill="#B8C0C0"/>
            <rect x="94" y="140" width="30" height="30" rx="6" fill="#146EB4"/><path d="M101 155l6 6 11-12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="134" y="144" width="96" height="9" rx="4" fill="#232F3E"/><rect x="134" y="159" width="66" height="7" rx="3" fill="#B8C0C0"/>
            <rect x="94" y="200" width="30" height="30" rx="6" fill="#146EB4"/><path d="M101 215l6 6 11-12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="134" y="204" width="60" height="9" rx="4" fill="#232F3E"/><rect x="134" y="219" width="46" height="7" rx="3" fill="#B8C0C0"/>
          </g>
          <circle cx="262" cy="230" r="62" fill="#fff" stroke="#FF9900" stroke-width="14"/>
          <circle cx="262" cy="212" r="18" fill="#232F3E"/>
          <path d="M228 262 a34 30 0 0 1 68 0z" fill="#232F3E"/>
          <circle cx="306" cy="276" r="22" fill="#146EB4" stroke="#fff" stroke-width="5"/>
          <path d="M296 276l7 7 12-13" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M326 170 l14 -12 M336 196 l20 -2" stroke="#FF9900" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
      <ul><li>자격요건·우대사항 확인</li><li>내 경험과의 적합성 점검</li></ul>
    </div>
    <div class="card">
      <div class="hd"><span class="n">03</span><span class="q">준비 방향 설정</span></div>
      <div class="art">
        <svg width="380" height="330" viewBox="0 0 380 330">
          <rect x="40" y="250" width="280" height="48" rx="12" fill="#146EB4"/><rect x="58" y="262" width="250" height="24" rx="6" fill="#fff"/>
          <rect x="60" y="208" width="250" height="46" rx="12" fill="#232F3E"/><rect x="76" y="220" width="222" height="22" rx="6" fill="#E8F4FB"/>
          <rect x="250" y="206" width="20" height="54" fill="#FF9900"/><path d="M250 260 l10 -10 10 10z" fill="#232F3E"/>
          <rect x="100" y="36" width="170" height="176" rx="16" fill="#37475A"/>
          <rect x="112" y="48" width="146" height="146" rx="8" fill="#fff"/>
          <path d="M150 86 l35 -14 35 14 -35 14z" fill="#232F3E"/><path d="M164 92v16c12 8 30 8 42 0v-16" fill="#232F3E"/>
          <path d="M220 86v20" stroke="#FF9900" stroke-width="4"/><circle cx="220" cy="108" r="5" fill="#FF9900"/>
          <rect x="128" y="132" width="18" height="18" rx="4" fill="#146EB4"/><rect x="154" y="136" width="80" height="8" rx="4" fill="#B8C0C0"/>
          <rect x="128" y="160" width="18" height="18" rx="4" fill="#146EB4"/><rect x="154" y="164" width="64" height="8" rx="4" fill="#B8C0C0"/>
          <path d="M290 60 l16 -16 M300 90 l22 -4 M276 40 l4 -20" stroke="#FF9900" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
      <ul><li>부족한 역량 도출</li><li>필요한 교육·학습 계획 수립</li></ul>
    </div>
  </div>
</div>
</body>
</html>
