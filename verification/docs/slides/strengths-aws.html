<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>해!듀케 장점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--line:#D5DBDB;--sub:#545B64;--soft:#F2F3F3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000;word-break:keep-all}
  .slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
  .top{padding:56px 40px 0}
  .top h1{font-size:56px;font-weight:700;letter-spacing:1px}
  .top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
  .top p{margin-top:18px;font-size:30px;color:var(--sub)}
  .cards{display:flex;gap:40px;padding:60px 60px 0}
  .card{flex:1;height:520px;border:3px solid var(--ink);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
  .card .hd{background:var(--ink);height:190px;display:flex;align-items:center;justify-content:center;position:relative}
  .card .n{position:absolute;left:22px;top:18px;background:var(--orange);color:var(--ink2);font-size:24px;font-weight:900;border-radius:22px;padding:2px 18px}
  .card .bd{padding:34px 34px 0;flex:1}
  .card h2{font-size:34px;font-weight:900;line-height:1.35;color:var(--ink2)}
  .card h2 em{font-style:normal;color:var(--orange2)}
  .card p{margin-top:22px;font-size:24px;line-height:1.6;color:var(--sub);font-weight:400}
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <h1>해!듀케의 장점<span class="dot"></span></h1>
    <p>실제로 운영할 수 있는 AI 서비스를 위한 세 가지 설계</p>
  </div>
  <div class="cards">
    <!-- 1 -->
    <div class="card">
      <div class="hd">
        <span class="n">01</span>
        <svg width="220" height="130" viewBox="0 0 220 130">
          <rect x="10" y="20" width="90" height="90" rx="16" fill="#FF9900"/>
          <path d="M40 46c-8 0-13 6-13 12-5 2-7 6-7 10s2 8 7 10c0 6 5 12 13 12z" fill="none" stroke="#232F3E" stroke-width="6" stroke-linejoin="round"/>
          <path d="M40 46v44M40 58h14l6-6M40 68h22M40 80h14l6 6" fill="none" stroke="#232F3E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="110" y="78" text-anchor="middle" font-family="Noto Sans KR" font-weight="900" font-size="30" fill="#fff">|</text>
          <rect x="120" y="20" width="90" height="90" rx="16" fill="#fff"/>
          <rect x="138" y="40" width="22" height="22" rx="4" fill="#146EB4"/><rect x="170" y="40" width="22" height="22" rx="4" fill="#232F3E"/>
          <rect x="138" y="70" width="22" height="22" rx="4" fill="#232F3E"/><rect x="170" y="70" width="22" height="22" rx="4" fill="#146EB4"/>
        </svg>
      </div>
      <div class="bd">
        <h2><em>AI만 가능한 일</em>과<br>알고리즘으로 될 일을 분리</h2>
        <p>문맥 해석처럼 AI가 꼭 필요한 곳에만 모델을 쓰고, 나머지는 기존 최적화 알고리즘과 아키텍처로 처리</p>
      </div>
    </div>
    <!-- 2 -->
    <div class="card">
      <div class="hd">
        <span class="n">02</span>
        <svg width="220" height="130" viewBox="0 0 220 130">
          <circle cx="80" cy="65" r="48" fill="#FF9900"/>
          <text x="80" y="84" text-anchor="middle" font-family="Noto Sans KR" font-weight="900" font-size="54" fill="#232F3E">$</text>
          <path d="M140 95 V75 M162 95 V60 M184 95 V45" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
          <path d="M132 40 Q160 20 190 30" fill="none" stroke="#FF9900" stroke-width="6" stroke-linecap="round"/>
          <path d="M180 22 l12 8 -10 10" fill="none" stroke="#FF9900" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="bd">
        <h2>유지비를 고려한<br><em>지속 가능한 운영</em></h2>
        <p>플랫폼 유지 비용을 따져 설계해, 실제로 운영할 수 있고 오래 유지되는 서비스를 구축</p>
      </div>
    </div>
    <!-- 3 -->
    <div class="card">
      <div class="hd">
        <span class="n">03</span>
        <svg width="220" height="130" viewBox="0 0 220 130">
          <path d="M110 10 l58 20 v36 c0 34 -26 52 -58 60 c-32 -8 -58 -26 -58 -60 v-36z" fill="#FF9900"/>
          <rect x="88" y="58" width="44" height="36" rx="6" fill="#232F3E"/>
          <path d="M96 58 v-10 a14 14 0 0 1 28 0 v10" fill="none" stroke="#232F3E" stroke-width="7"/>
          <circle cx="110" cy="74" r="5" fill="#FF9900"/><rect x="108" y="76" width="4" height="10" fill="#FF9900"/>
        </svg>
      </div>
      <div class="bd">
        <h2>국가 망 보안체계를 참고한<br><em>사용자 정보 관리</em></h2>
        <p>국가 망 보안체계를 기준으로 삼아 사용자 정보를 안전하게 관리</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
