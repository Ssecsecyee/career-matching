<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>한계점: 지속적인 상담과 사용자 보호</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--line:#D5DBDB;--sub:#545B64;--soft:#F2F3F3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000;word-break:keep-all}
.slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
.top{padding:56px 40px 0}
.top h1{font-size:56px;font-weight:700;letter-spacing:1px}
.top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
.top p{margin-top:18px;font-size:30px;color:var(--sub)}
.card{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .hd{background:var(--ink);color:#fff;font-size:28px;font-weight:900;padding:16px 24px;display:flex;align-items:center;gap:14px}
.card .hd .n{background:var(--orange);color:var(--ink2);border-radius:16px;padding:0 12px;font-size:22px}
.bar{position:absolute;left:40px;right:40px;bottom:50px;min-height:84px;border:3px solid var(--orange);border-radius:14px;display:flex;align-items:center;gap:24px;padding:0 26px;background:#FFF8EC}
.bar .tag{background:var(--ink);color:#fff;border-radius:30px;padding:6px 22px;font-size:24px;font-weight:900;flex:none}
.bar .txt{font-size:28px;font-weight:700;color:var(--ink2)}
.bar .txt b{color:var(--orange2)}
.row{display:flex;gap:40px;padding:44px 40px 0}.row .card{flex:1;height:440px}
.bd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.bd p{font-size:28px;line-height:1.6;color:var(--sub)}.bd p b{color:var(--ink2)}
</style></head><body><div class="slide">
<div class="top"><h1>한계점: 지속적인 상담과 사용자 보호<span class="dot"></span></h1><p>계정 기반 장기 상담을 위해 함께 해결할 과제</p></div>

<div class="row">
 <div class="card"><div class="hd"><span class="n">01</span>유저 관리 기능 부재</div>
  <div class="bd"><svg width="150" height="130" viewBox="0 0 150 130"><circle cx="58" cy="40" r="24" fill="#232F3E"/><path d="M14 112a44 40 0 0 1 88 0z" fill="#232F3E"/><circle cx="108" cy="86" r="30" fill="#fff" stroke="#FF9900" stroke-width="7"/><path d="M108 70v17l11 8" stroke="#FF9900" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M84 112 l50 -52" stroke="#EC7211" stroke-width="7" stroke-linecap="round"/></svg>
  <p>사용자별 상담 이력이 이어지지 않아<br><b>장기간 취업 준비·변화 추적</b>에 한계</p></div></div>
 <div class="card"><div class="hd"><span class="n">02</span>사용자 정보 보호 설계</div>
  <div class="bd"><svg width="150" height="130" viewBox="0 0 150 130"><path d="M75 6 l52 18 v34 c0 34 -24 52 -52 62 c-28 -10 -52 -28 -52 -62 v-34z" fill="#FF9900"/><rect x="55" y="56" width="40" height="32" rx="6" fill="#232F3E"/><path d="M62 56v-9a13 13 0 0 1 26 0v9" fill="none" stroke="#232F3E" stroke-width="7"/><circle cx="75" cy="72" r="5" fill="#FF9900"/></svg>
  <p>계정 기능을 도입하면<br><b>개인정보·대화 보호</b>를 더 강화해야 함</p></div></div>
</div>
<div class="bar"><span class="tag">결론</span><span class="txt">계정 기능과 보안 정책을 함께 설계해야 <b>장기 컨설팅으로 확장</b>할 수 있다</span></div>
</div></body></html>
