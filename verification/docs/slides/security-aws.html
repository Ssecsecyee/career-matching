<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>보안 개선 방향: 정보별 차등 보호</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#232F3E;--ink2:#131A22;--orange:#FF9900;--orange2:#EC7211;--blue:#146EB4;--line:#D5DBDB;--sub:#545B64;--soft:#F2F3F3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Noto Sans KR",sans-serif;color:#000;word-break:keep-all}
.slide{width:1600px;height:900px;position:relative;overflow:hidden;background:#fff}
.top{padding:56px 40px 0}
.top h1{font-size:56px;font-weight:700;letter-spacing:1px}
.top h1 .dot{display:inline-block;width:20px;height:20px;background:var(--orange);margin-left:8px;vertical-align:-4px}
.top p{margin-top:18px;font-size:30px;color:var(--sub)}
.card{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .hd{background:var(--ink);color:#fff;font-size:28px;font-weight:900;padding:16px 24px;display:flex;align-items:center;gap:14px}
.card .hd .n{background:var(--orange);color:var(--ink2);border-radius:16px;padding:0 12px;font-size:22px}
.bar{position:absolute;left:40px;right:40px;bottom:50px;min-height:84px;border:3px solid var(--orange);border-radius:14px;display:flex;align-items:center;gap:24px;padding:0 26px;background:#FFF8EC}
.bar .tag{background:var(--ink);color:#fff;border-radius:30px;padding:6px 22px;font-size:24px;font-weight:900;flex:none}
.bar .txt{font-size:28px;font-weight:700;color:var(--ink2)}
.bar .txt b{color:var(--orange2)}
.row{display:flex;gap:36px;padding:44px 40px 0}.row .card{flex:1;height:440px}
.hd .code{background:#fff;color:var(--ink2);border-radius:10px;padding:0 14px;font-size:26px}
.bd{flex:1;padding:40px 34px}.bd h3{font-size:32px;font-weight:900;color:var(--ink2)}
.bd p{margin-top:26px;font-size:26px;line-height:1.7;color:var(--sub)}
</style></head><body><div class="slide">
<div class="top"><h1>보안 개선 방향: 정보별 차등 보호<span class="dot"></span></h1><p>서비스 내부 분류안 · 운영자도 권한과 목적에 따라 접근·기록</p></div>
<div class="row"><div class="card" style="border-color:#EC7211"><div class="hd" style="background:#EC7211;justify-content:center"><svg width="56" height="56" viewBox="0 0 80 80"><rect x="18" y="38" width="44" height="34" rx="6" fill="#fff"/><path d="M26 38v-8a14 14 0 0 1 28 0v8" fill="none" stroke="#fff" stroke-width="7"/><circle cx="40" cy="55" r="5" fill="#EC7211"/></svg>기밀 <span class="code">C</span></div><div class="bd"><h3>사용자 개인정보</h3><p>직접 식별 정보 분리<br>최소 권한·암호화</p></div></div><div class="card" style="border-color:#146EB4"><div class="hd" style="background:#146EB4;justify-content:center"><svg width="56" height="56" viewBox="0 0 80 80"><path d="M10 16h40v28H28l-10 9v-9h-8z" fill="#fff"/><path d="M56 28h14v26h-6v8l-9-8H34v-6" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>민감 <span class="code">S</span></div><div class="bd"><h3>대화·경험·관심 정보</h3><p>조합하면 개인 추정 가능<br>운영자 접근 관리·보관 제한</p></div></div><div class="card" style="border-color:#232F3E"><div class="hd" style="background:#232F3E;justify-content:center"><svg width="56" height="56" viewBox="0 0 80 80"><circle cx="40" cy="40" r="26" fill="none" stroke="#fff" stroke-width="6"/><path d="M14 40h52M40 14c-12 14-12 38 0 52M40 14c12 14 12 38 0 52" fill="none" stroke="#fff" stroke-width="4"/></svg>공개 <span class="code">O</span></div><div class="bd"><h3>공개된 채용·교육공고</h3><p>공개 가능한 원문 범위<br>출처·버전·정확성 관리</p></div></div></div><div class="bar"><span class="tag">계획</span><span class="txt">국가 망 보안체계(N2SF)를 참고해 <b>정보 등급별 보호체계</b>로 구성할 계획</span></div>
</div></body></html>
